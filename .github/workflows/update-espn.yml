name: Update ESPN Fantasy Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ESPN fantasy data
        run: |
          curl --fail --silent --show-error \
            https://fantasy.winnresources.com/league \
            -o league.json

          curl --fail --silent --show-error \
            https://fantasy.winnresources.com/rosters \
            -o rosters.json

          curl --fail --silent --show-error \
            https://fantasy.winnresources.com/players \
            -o players.json

      - name: Commit updated data
        run: |
          git config user.name "ESPN Fantasy Updater"
          git config user.email "actions@github.com"

          git add league.json rosters.json players.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update ESPN fantasy data"
          git push
